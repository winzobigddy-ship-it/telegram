<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7fd">
  <meta name="description" content="India Lending — connect with us on Telegram for information and support.">
  <title>India Lending | Official Channel</title>
  <style>
    :root{--ink:#111126;--muted:#56566d;--pink:#ed35a7;--purple:#8651ed;--cyan:#20c5ca;--line:#e9e8f0}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Arial,Helvetica,sans-serif;background:radial-gradient(ellipse at 14% 15%,#f4c9f1 0,transparent 31%),radial-gradient(ellipse at 90% 75%,#c9fafa 0,transparent 32%),linear-gradient(120deg,#fff5fc,#f9f8ff 50%,#f5ffff);min-height:100vh}.wrap{width:min(660px,calc(100% - 34px));margin:auto}
    .top{padding:28px 0 27px}.channel{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 19px;background:#fffC;border:2px solid #f2d5f1;border-radius:999px;box-shadow:0 8px 28px #a948a326}.identity{display:flex;align-items:center;gap:13px;min-width:0}.avatar{width:58px;height:58px;flex:0 0 58px;border:4px solid #fff;border-radius:50%;display:grid;place-items:center;color:white;font-size:20px;font-weight:900;background:linear-gradient(145deg,#ee2686,#fb4c56 53%,#7e4af2);box-shadow:0 0 0 2px #e891d3}.brand{font-size:16px;font-weight:900;font-style:italic;letter-spacing:-.04em;white-space:nowrap}.verified{margin-top:4px;font-size:11px;letter-spacing:.23em;font-weight:700;color:#737184;white-space:nowrap}.live{flex:none;color:white;background:linear-gradient(100deg,#ed37ad,#8f51ec);font-size:12px;font-weight:800;letter-spacing:.2em;border-radius:30px;padding:15px 20px;box-shadow:0 4px 12px #c744b944}.live i{display:inline-block;width:8px;height:8px;background:#fff;border-radius:50%;margin-right:7px}
    .hero{position:relative;overflow:hidden;text-align:center;padding:64px 42px 37px;background:linear-gradient(145deg,#fff 0%,#fffaff 53%,#f8ffff 100%);border-radius:38px 38px 0 0;box-shadow:0 10px 35px #39214d10}.hero:before,.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;filter:blur(50px);opacity:.27;pointer-events:none}.hero:before{background:#e847bb;top:67px;left:calc(50% - 185px)}.hero:after{background:#7455ef;top:69px;right:calc(50% - 185px)}.hero>*{position:relative;z-index:1}.profile{height:194px;display:flex;align-items:flex-start;justify-content:center}.bigavatar{position:relative;margin-top:0;width:190px;height:190px;border-radius:50%;padding:7px;background:linear-gradient(145deg,#19c4e4 5%,#7254eb 54%,#f43aa3 100%);box-shadow:0 9px 38px #8055d855}.bigavatar span{width:100%;height:100%;border:5px solid #fff;border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 32% 27%,#ff769e,#ed2258 45%,#bd174f 100%);font-size:65px;font-weight:900;letter-spacing:-.06em}.tick{position:absolute;right:-7px;bottom:0;width:62px;height:62px;border:5px solid white;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#df40db,#6458ff);font-size:29px;font-weight:900;box-shadow:0 4px 13px #8949d744}.label{display:inline-block;margin-top:25px;padding:11px 21px;border:1px solid #f4c9e1;border-radius:30px;background:#fff3fa;color:#d24892;font-size:13px;letter-spacing:.25em;font-weight:800}.label:before{content:"• ";color:#ea48ad}h1{margin:26px auto 22px;max-width:580px;font-size:clamp(39px,7vw,58px);line-height:1.07;letter-spacing:-.055em}h1 span{color:#8b56df}.intro{max-width:560px;margin:0 auto;color:#55556a;font-size:clamp(17px,3.25vw,22px);line-height:1.75}.intro em{color:#bf43a0;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:47px 0 48px;padding:34px 0;border-top:1px solid #eff0f4;border-bottom:1px solid #eff0f4}.stat+.stat{border-left:1px solid #e7e6ed}.stat b{font-size:clamp(24px,5vw,37px);letter-spacing:-.04em}.stat:nth-child(3) b{color:#9954dc}.stat small{display:block;margin-top:13px;color:#68677b;font-size:11px;font-weight:800;letter-spacing:.2em}.cta{display:flex;align-items:center;justify-content:center;gap:17px;min-height:92px;padding:18px 22px;border-radius:60px;text-decoration:none;color:#fff;background:linear-gradient(100deg,#f02da4 0%,#bd3bd1 52%,#7854ee 100%);font-size:clamp(16px,3.1vw,22px);font-weight:900;box-shadow:0 15px 29px #c43fb94d;transition:transform .18s,box-shadow .18s}.cta:hover{transform:translateY(-2px);box-shadow:0 19px 34px #c43fb965}.telegram{font-size:24px}.cta .arrow{font-size:25px;margin-left:4px}.cta:focus-visible{outline:3px solid var(--ink);outline-offset:5px}.checks{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 21px;margin:29px auto 0;color:#68677b;font-size:13px;font-weight:700;letter-spacing:.08em}.checks span:before{content:"✓";color:#18b7bd;font-size:17px;margin-right:8px}.status{margin:24px auto 0;color:#68677b;font-size:14px;letter-spacing:.08em}.status b{color:#b746a5}.below{height:24px;border-bottom:4px solid #e682ca;border-radius:0 0 8px 8px;background:#fff}
    @media(max-width:520px){.wrap{width:calc(100% - 28px)}.top{padding:18px 0 18px}.channel{padding:10px 12px;gap:7px}.avatar{width:50px;height:50px;flex-basis:50px}.brand{font-size:11px}.verified{font-size:9px;letter-spacing:.17em}.live{padding:12px 13px;font-size:10px;letter-spacing:.14em}.hero{padding:47px 22px 29px;border-radius:32px 32px 0 0}.profile{height:165px}.bigavatar{width:160px;height:160px}.bigavatar span{font-size:56px}.tick{width:54px;height:54px;font-size:25px}.join-message{margin-top:26px;font-size:25px}.label{font-size:10px;letter-spacing:.17em;padding:10px 14px;margin-top:19px}h1{margin:25px auto 19px;font-size:clamp(38px,10vw,50px)}.intro{font-size:17px;line-height:1.72}.stats{margin:37px 0 39px;padding:25px 0}.stat small{font-size:9px;letter-spacing:.12em;margin-top:10px}.cta{min-height:76px;gap:10px;padding:14px 10px;font-size:16px}.telegram{font-size:21px}.checks{font-size:11px;letter-spacing:.03em;gap:6px 13px;margin-top:23px}.status{font-size:12px;margin-top:21px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto;transition:none!important}}
  </style>
</head>
<body>
  <header class="top wrap"><div class="channel"><div class="identity"><div class="avatar" aria-hidden="true">A</div><div><div class="brand">INDIA NEW DAMAN CLUB</div><div class="verified">VERIFIED CHANNEL</div></div></div><div class="live"><i></i>LIVE</div></div></header>
  <main class="hero wrap">
    <div class="profile"><div class="bigavatar"><span>IND</span><div class="tick" aria-label="Verified">✓</div></div></div>
    <div class="label">OFFICIAL TELEGRAM CHANNEL</div>
    <div class="join-message">GUYS, JALDI JALDI JOIN HO JAO.</div>
    <div class="stats" aria-label="India Lending highlights"><div class="stat"><b>1M+</b><small>USERS JOINING</small></div><div class="stat"><b>Direct</b><small>SUPPORT</small></div><div class="stat"><b>Simple</b><small>TO CONNECT</small></div></div>
    <a class="cta" id="join-button" href="https://t.me/IndianewDamanclub" target="_blank" rel="noopener noreferrer" aria-disabled="true" tabindex="-1"><span class="telegram" aria-hidden="true">➤</span><span id="join-label">JOIN NOW · 15</span><span class="arrow" aria-hidden="true">→</span></a>
    <div class="checks"><span>Ask your questions</span><span>Review terms first</span><span>Decide at your pace</span></div>
    <div class="status" id="countdown-status" aria-live="polite">Join available in <b>15 seconds</b></div>
  </main>
  <div class="below wrap"></div>
  <script>
    (function () {
      let remaining = 15;
      const button = document.getElementById('join-button');
      const label = document.getElementById('join-label');
      const status = document.getElementById('countdown-status');
      const timer = window.setInterval(function () {
        remaining -= 1;
        if (remaining <= 0) {
          window.clearInterval(timer);
          label.textContent = 'JOIN NOW';
          button.removeAttribute('aria-disabled');
          button.removeAttribute('tabindex');
          status.innerHTML = 'Status: <b>Ready</b> · opens in Telegram';
          return;
        }
        label.textContent = 'JOIN NOW · ' + remaining;
        status.innerHTML = 'Join available in <b>' + remaining + ' seconds</b>';
      }, 1000);
      button.addEventListener('click', function (event) {
        if (remaining > 0) event.preventDefault();
      });
    }());
  </script></body>
</html>
